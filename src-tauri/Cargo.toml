[package]
name = "inkwell"
version = "0.1.0"
description = "Inkwell: a fast, private PDF app"
authors = ["Berkay"]
edition = "2024"
license = "AGPL-3.0-or-later"
default-run = "inkwell"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows cargo quirk).
name = "inkwell_lib"
crate-type = ["rlib"]

[[bin]]
name = "inkwell"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
parking_lot = "0.12"
lru = "0.12"
thiserror = "2"
# Reads the user's codex config.toml (MCP server names). Already in the tree through tauri's build deps.
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation"] }
# Same versions tauri already pulls in; used to switch off WebView2's browser shortcuts.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[patch.crates-io]
# Local patch: `max_align_t` is not emitted by bindgen on MSVC, which breaks mupdf 0.8.0's native-device assert.
mupdf = { path = "../vendor/mupdf" }
# Local patch: JPEG 2000 decoding took MuPDF's global FreeType lock, so a JPX-heavy file (artbooks, scans)
# decoded one image at a time however many workers there were. The opj allocator context is thread-local now.
mupdf-sys = { path = "../vendor/mupdf-sys" }
