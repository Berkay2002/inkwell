[package]
name = "inkwell"
version = "0.1.0"
description = "Inkwell: a fast, private PDF app"
authors = ["Berkay"]
edition = "2024"
license = "AGPL-3.0-or-later"
default-run = "inkwell"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows cargo quirk).
name = "inkwell_lib"
crate-type = ["rlib"]

[[bin]]
name = "inkwell"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mupdf = "0.8"
parking_lot = "0.12"
lru = "0.12"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[patch.crates-io]
# Local patch: `max_align_t` is not emitted by bindgen on MSVC, which breaks mupdf 0.8.0's native-device assert.
mupdf = { path = "../vendor/mupdf" }
