[package]
name = "inkwell"
version = "0.1.0"
description = "Inkwell: a fast, private PDF app"
authors = ["Berkay"]
edition = "2024"
license = "AGPL-3.0-or-later"
default-run = "inkwell"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows cargo quirk).
name = "inkwell_lib"
crate-type = ["rlib"]

[[bin]]
name = "inkwell"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "history_bench"
path = "src/bin/history_bench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
parking_lot = "0.12"
lru = "0.12"
thiserror = "2"
regex = "1"
flate2 = "1"
# Reads the user's codex config.toml (MCP server names). Already in the tree through tauri's build deps.
toml = "0.8"
# Version history store (history/) and compare (diff/).
fastcdc = "3"
blake3 = "1"
zstd = "0.13"
chacha20poly1305 = "0.10"
getrandom = "0.3"
similar = "2"
zeroize = "1"
icu_normalizer = "2.3"
# Encodes page images for tool results. Already in the tree through tauri.
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiff = "0.11"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Digital signatures (sign/crypto, adapted from pdfcraft): X.509, CMS, PKCS #12, RSA/ECDSA. RustCrypto, same versions pdfcraft pins.
sha1 = "0.11"
sha2 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["std", "hazmat", "encoding"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hmac = "0.13"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
des = "0.9"
rc2 = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }
# Same versions tauri already pulls in; used to switch off WebView2's browser shortcuts.
webview2-com = "0.39"
windows-core = "0.62"
# Windows.Media.Ocr (OCR backend); already in the tree through tauri, this only adds feature flags.
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation_Collections"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# Debug-build speed for RSA key generation and signing (tests, `cargo run`).
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.crypto-primes]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3

[patch.crates-io]
# Local patch: `max_align_t` is not emitted by bindgen on MSVC, which breaks mupdf 0.8.0's native-device assert.
mupdf = { path = "../vendor/mupdf" }
# Local patch: JPEG 2000 decoding took MuPDF's global FreeType lock, so a JPX-heavy file (artbooks, scans)
# decoded one image at a time however many workers there were. The opj allocator context is thread-local now.
mupdf-sys = { path = "../vendor/mupdf-sys" }
